<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>犯罪学｜看见真相，理解原因</title><style>
:root{color-scheme:dark;--bone:#eee9df;--orange:#ff6b35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#080808;color:var(--bone);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100dvh}button,input{font:inherit}button{color:inherit;background:#191815;border:1px solid #36312b;border-radius:5px;padding:7px 13px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--orange)}button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}[hidden]{display:none!important}#header{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #25221e;font-size:12px;letter-spacing:.08em}#header strong{font-size:14px;letter-spacing:.12em}#shot{color:#a9a294;font-size:11px;letter-spacing:0}#stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}#reel{position:relative;overflow:hidden;background:#090909}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#overlay{z-index:1;cursor:pointer}#poster{position:absolute;z-index:2;left:50%;top:57%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;border-radius:40px;padding:14px 23px;border-color:#ff6b3580;background:#14100ccd;box-shadow:0 0 40px #ff6b3520;backdrop-filter:blur(6px)}#poster svg{width:20px;height:20px;fill:var(--orange)}#controls{flex:none;padding:12px 24px 13px;border-top:1px solid #26211c;background:#11100e}#timeline{--progress:0%;appearance:none;-webkit-appearance:none;width:100%;margin:6px 0 13px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--orange) var(--progress),#39342e var(--progress));cursor:pointer}#timeline::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--orange)}#timeline::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--orange)}.row{display:flex;align-items:center;gap:8px}#play{background:var(--orange);border-color:var(--orange);color:#130c08;font-weight:700;min-width:65px}#time{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;margin:0 5px;color:#b5aea2}.spacer{flex:1}#music[aria-pressed=false],#voice[aria-pressed=false]{opacity:.45}#chapters{display:flex;gap:5px;overflow:auto;scrollbar-width:none;margin-top:10px}#chapters button{font-size:11px;border-radius:3px;padding:4px 10px;color:#c0b8aa}#chapters button[aria-current=true]{color:var(--orange);border-color:#ff6b3566;background:#ff6b3510}#restore{position:fixed;z-index:10;bottom:16px;right:16px;border-color:#ff6b3555;opacity:.7}#status{position:fixed;left:16px;bottom:150px;color:#d4cbbb;font-size:12px;max-width:90%;pointer-events:none}#status:empty{display:none}@media(max-width:700px){#header{padding:0 12px;height:36px}#header strong{font-size:12px}#shot{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#controls{padding:10px 12px 12px}.row{gap:5px;flex-wrap:wrap}button{font-size:12px;padding:6px 10px}#time{font-size:11px}#chapters{margin-top:8px}#poster{padding:10px 16px;font-size:12px}#music,#voice{padding:6px 8px}.spacer{min-width:0}}@media(max-height:450px){#header{height:28px}#controls{padding:6px 12px 8px}#chapters{display:none}#timeline{margin:4px 0 8px}.row button{padding:4px 9px}}
</style></head><body>
<header id="header"><strong>犯罪学 / CRIMINOLOGY</strong><span id="shot"></span></header>
<main id="stage"><div id="reel"><canvas id="depth" aria-label="犯罪学三维宣传片"></canvas><canvas id="overlay" aria-hidden="true"></canvas><button id="poster" aria-label="播放宣传片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l14-8z"/></svg>开始播放</button></div></main>
<footer id="controls"><input id="timeline" type="range" min="0" max="42" step="0.01" value="0" aria-label="播放位置"><div class="row"><button id="play" aria-label="播放">播放</button><button id="replay" aria-label="重播">重播</button><span id="time">00:00 / 00:42</span><span class="spacer"></span><button id="music" aria-pressed="true">音乐</button><button id="voice" aria-pressed="true">旁白</button><button id="mute" aria-label="静音">静音</button><button id="fullscreen" aria-label="全屏">全屏</button><button id="hide" aria-label="隐藏控制">收起</button></div><nav id="chapters" aria-label="章节"></nav></footer><button id="restore" hidden aria-label="显示控制">显示控制</button><p id="status" role="status"></p>
