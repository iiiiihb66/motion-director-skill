<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Lab · 视觉语言实验</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#191b1d;--ink:#eeede8;--muted:#9d9fa1;--line:#35383a;--accent:#ff7043}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1200px;padding:34px 28px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:27px;letter-spacing:-1px;margin:0}header p{margin:3px 0;color:var(--muted)}.tag{color:var(--accent);font:11px monospace;letter-spacing:2px}.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}button,select,input{font:inherit}button,select{color:var(--ink);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{border-color:#8d9294}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.style{text-align:left;padding:14px 18px}.style strong{display:block;font-size:15px}.style span{color:var(--muted);font-size:12px}.style[aria-pressed=true]{border-color:var(--accent);background:#29201c}.stage{display:grid;place-items:center;background:#090a0a;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:220px}.stage canvas{display:block;width:100%;aspect-ratio:16/9}.stage.portrait canvas{width:min(100%,350px);aspect-ratio:9/16}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}#play{background:var(--ink);color:#151719;min-width:78px;font-weight:650}#scrub{flex:1;min-width:100px;accent-color:var(--accent)}#clock{font:12px monospace;font-variant-numeric:tabular-nums;white-space:nowrap}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shots button{text-align:left;font-size:12px}.shots button.active{color:var(--accent);border-color:var(--accent)}.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin-top:24px;border-top:1px solid var(--line);padding-top:20px}.detail h2{font-size:15px;margin:0 0 6px}.detail p{color:var(--muted);font-size:13px;margin:0}.settings{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}.settings label{font-size:12px;color:var(--muted)}input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:7px 8px;width:160px}input[type=number]{width:75px}.footer{margin-top:18px;color:var(--muted);font-size:12px}body.immersive main{max-width:none;padding:0}body.immersive header,body.immersive .styles,body.immersive .controls,body.immersive .shots,body.immersive .detail,body.immersive .footer{display:none}body.immersive .stage{height:100vh;border:0;border-radius:0}body.immersive canvas{width:min(100vw,177.77vh)}body.immersive .portrait canvas{width:min(100vw,56.25vh)}@media(max-width:650px){main{padding:20px 12px}.tag{display:none}.style{padding:10px}.style span{font-size:10px}.detail{grid-template-columns:1fr;gap:16px}.shots button{padding:8px 6px}h1{font-size:23px}}
</style>
<main>
<header><div><h1>Motion Lab / 视觉语言实验</h1><p>同一个故事，三种拍法。先看动作，再谈风格。</p></div><div class="tag">STUDY 01 · IDEA → SYSTEM</div></header>
<div class="styles" role="group" aria-label="视觉语言">
<button class="style" data-theme="technical" aria-pressed="true"><strong>01 / 工程图谱</strong><span>信号追踪 · 网络连线 · 阈值冲击</span></button>
<button class="style" data-theme="editorial" aria-pressed="false"><strong>02 / 编辑排版</strong><span>纸面切分 · 字体尺度 · 模块重组</span></button>
<button class="style" data-theme="organic" aria-pressed="false"><strong>03 / 有机生长</strong><span>种子萌发 · 枝条分叉 · 呼吸回稳</span></button>
</div>
<div class="stage" id="stage"><canvas id="canvas" width="960" height="540" aria-label="从想法到系统的动态视觉预览"></canvas></div>
<div class="controls"><button id="play">播放</button><input id="scrub" type="range" min="0" max="24" step="0.01" value="0" aria-label="播放时间"><span id="clock">00.00 / 24.00</span><label><input id="loop" type="checkbox"> 循环</label><select id="quality" aria-label="清晰度"><option value="low">轻量 · 30fps</option><option value="high">清晰 · 30fps</option></select><button id="ratio">切换竖屏</button></div>
<div class="shots" id="shots"><button data-shot="0">00—06 / 一个起点</button><button data-shot="1">06—12 / 建立联系</button><button data-shot="2">12—18 / 穿过临界</button><button data-shot="3">18—24 / 形成秩序</button></div>
<div class="detail"><div><h2 id="shotName">一个起点</h2><p id="shotNote"></p><div class="settings"><label>主题标题 <input type="text" id="title" value="从想法，到系统" maxlength="14"></label><label>种子 <input type="number" id="seed" value="55" min="0" max="9999"></label></div></div><div><h2>看什么</h2><p>起点是否引出下一步？冲击前有没有预备？形状变化是否解释内容？切换风格后，是否仍能读懂同一个故事？这四点比特效数量更有用。</p><div class="settings"><label><input type="checkbox" id="reduced"> 减弱动态</label><button id="hide">沉浸预览 · H</button></div></div></div>
<p class="footer">24 秒无声研究小样 · 120 BPM 设计网格，未分析音频 · 空格播放，← → 跳 1 秒，[ ] 换镜头，H 隐藏面板 · 暂停或切到后台停止连续绘制 · 无需网络或安装</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d',{alpha:false});
const DUR=24,SCENE=6,TAU=Math.PI*2;
const titles=['一个起点','建立联系','穿过临界','形成秩序'];
const notes=['先给一个有位置、有方向的起点，再让它留下轨迹。','同一母题从单体变成关系；分支依次响应，避免所有层一起动。','先收紧，后释放。冲击改变结构，而不是覆盖一层特效。','让开场符号以新的关系回归；结果需要观众能读懂的停顿。'];
const themes={technical:{bg:'#0c1115',fg:'#eee7da',muted:'#7e8b90',line:'#29363b',accent:'#ff602e'},editorial:{bg:'#f2eedf',fg:'#182d5b',muted:'#69758b',line:'#d3d4cb',accent:'#da3c2c'},organic:{bg:'#e5ebd8',fg:'#214c3d',muted:'#698173',line:'#c1ceb7',accent:'#c26939'}};
let config={theme:'technical',seed:55,title:'从想法，到系统',portrait:false,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};
let time=0,playing=false,raf=0,anchor=0,lastDraw=-Infinity,renderCost=0;
$('reduced').checked=config.reduced;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const prog=(t,a,b)=>ease((t-a)/(b-a));
function spring(x){if(x<=0)return 0;if(x>=1)return 1;return 1-Math.exp(-8*x)*Math.cos(x*11)}
function rand(n,seed=config.seed){const x=Math.sin(n*127.1+seed*311.7)*43758.5453;return x-Math.floor(x)}
function line(x1,y1,x2,y2,color,width=1,alpha=1){ctx.globalAlpha=clamp(alpha);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1}
function circle(x,y,r,color,fill=true,width=1,alpha=1){if(r<=0)return;ctx.globalAlpha=clamp(alpha);ctx.beginPath();ctx.arc(x,y,r,0,TAU);if(fill){ctx.fillStyle=color;ctx.fill()}else{ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}ctx.globalAlpha=1}
function text(str,x,y,size,color,weight=500,family='sans-serif',align='left',alpha=1){ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.textAlign=align;ctx.font=`${weight} ${size}px ${family==='serif'?'Georgia,"Songti SC",serif':family==='mono'?'"SFMono-Regular",Consolas,monospace':'"PingFang SC","Microsoft YaHei",sans-serif'}`;ctx.fillText(str,x,y);ctx.globalAlpha=1}
function fitted(str,x,y,size,color,maxWidth,weight=500,family='sans-serif',align='left'){ctx.font=`${weight} ${size}px "PingFang SC",sans-serif`;const w=ctx.measureText(str).width;text(str,x,y,Math.min(size,size*maxWidth/Math.max(1,w)),color,weight,family,align)}
function rect(x,y,w,h,color,alpha=1){ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.globalAlpha=1}
function nodes(g){const {x,y,w,h}=g;return Array.from({length:20},(_,i)=>{const col=i%5,row=Math.floor(i/5);return {x:x+w*(.08+col*.21)+(rand(i*3)-.5)*w*.05,y:y+h*(.1+row*.26)+(rand(i*3+1)-.5)*h*.06}})}
function header(T,t,idx,W,H){const m=W*.07;line(m,H*.115,W-m,H*.115,T.line);text('MOTION / '+String(idx+1).padStart(2,'0'),m,H*.075,12,T.muted,500,'mono');text(['SIGNAL','RELATION','THRESHOLD','ORDER'][idx],W-m,H*.075,12,T.muted,500,'mono','right');text(config.title,m,H*.90,config.portrait?19:23,T.fg,600);text(String(Math.floor(t*120/60)).padStart(2,'0')+' / BEAT',W-m,H*.955,11,T.muted,500,'mono','right');line(m,H*.925,W-m,H*.925,T.line);rect(m,H*.925,(W-2*m)*(t/DUR),2,T.accent)}
function technical(T,s,u,g,t){const {x,y,w,h}=g,N=nodes(g);for(let i=0;i<=10;i++){line(x+i*w/10,y,x+i*w/10,y+h,T.line,.6);line(x,y+i*h/10,x+w,y+i*h/10,T.line,.6)}
if(s===0){const q=prog(u,.2,3.8),xs=x+w*.08;ctx.beginPath();ctx.moveTo(xs,y+h*.64);let px=xs,py=y+h*.64;for(let i=0;i<=150*q;i++){const p=i/150;px=xs+w*.82*p;py=y+h*(.64-.24*p+.09*Math.sin(p*13)*Math.sin(p*3));ctx.lineTo(px,py)}ctx.strokeStyle=T.accent;ctx.lineWidth=2.2;ctx.stroke();circle(px,py,6,T.accent);circle(px,py,16,T.accent,false,1,.3);text('01 →',x,y+h*.25,config.portrait?48:70,T.fg,650,'mono');text('一个点，开始留下轨迹',x,y+h*.94,15,T.muted);text('INPUT / '+q.toFixed(2),px-3,py-24,11,T.muted,400,'mono');}
else if(s===1){for(let i=0;i<N.length;i++){const p=prog(u,.12+i*.09,1.2+i*.09),a=N[i],b=N[Math.max(0,i-1)];line(b.x,b.y,lerp(b.x,a.x,p),lerp(b.y,a.y,p),i%4?T.muted:T.accent,1.3,p);circle(a.x,a.y,3.5*p,i%4?T.fg:T.accent);if(i%4===0)text(String(i).padStart(2,'0'),a.x+8,a.y-8,10,T.muted,400,'mono')}const p=prog(u,2.6,3.5);circle(N[12].x,N[12].y,lerp(4,22,p),T.accent,false,1.3,p);text('连线，让局部成为整体',x,y+h*.98,15,T.muted);}
else if(s===2){const a=prog(u,.3,1.6),b=prog(u,1.8,2.6),cx=x+w*.5,cy=y+h*.48;for(let i=0;i<16;i++){const th=i/16*TAU,r=(w*.37*(1-a*.75)+w*.48*b)*(config.reduced?.7:1);line(cx,cy,cx+Math.cos(th)*r,cy+Math.sin(th)*r*.72,T.accent,1.5);circle(cx+Math.cos(th)*r,cy+Math.sin(th)*r*.72,3,T.fg)}if(u>1.8)circle(cx,cy,w*.7*prog(u,1.8,3.1),T.accent,false,2,1-prog(u,1.8,3.1));text((u<1.8?'收紧':'突破'),cx,cy+13,config.portrait?34:52,T.fg,700,'sans-serif','center');text('CRITICAL / '+Math.round(100*a)+'%',x,y+h*.98,12,T.muted,400,'mono');}
else{const p=prog(u,.15,2.8);for(let i=0;i<N.length;i++){const col=i%5,row=Math.floor(i/5),a=N[i],bx=x+w*(.08+col*.21),by=y+h*(.13+row*.23);const nx=lerp(a.x,bx,p),ny=lerp(a.y,by,p);if(col<4)line(nx,ny,lerp(N[i+1].x,bx+w*.21,p),lerp(N[i+1].y,by,p),T.line,1.2);if(row<3)line(nx,ny,lerp(N[i+5].x,bx,p),lerp(N[i+5].y,by+h*.23,p),T.line,1.2);circle(nx,ny,i===12?6:3,i===12?T.accent:T.fg)}text('同一个点，拥有新的位置',x,y+h*.98,15,T.muted);}}
function editorial(T,s,u,g){const {x,y,w,h}=g;const big=config.portrait?90:155;
if(s===0){const p=prog(u,.2,1.8);rect(x,y+h*.08,w*.13*p,h*.67,T.accent);text('1',x+w*.21,y+h*.66,big,T.fg,500,'serif');line(x+w*.55,y+h*.67,x+w*(.55+.4*prog(u,1,3)),y+h*.67,T.fg,2);text('IDEA',x+w*.55,y+h*.39,config.portrait?22:40,T.fg,600);text('让一个想法，占据真实的位置。',x,y+h*.95,14,T.muted)}
else if(s===1){const bw=w*.27,bh=h*.23;for(let i=0;i<9;i++){const col=i%3,row=Math.floor(i/3),p=prog(u,.12+i*.12,1.1+i*.12);const xx=x+col*w*.34,yy=y+row*h*.31+(1-p)*24;rect(xx,yy,bw*p,bh,i===4?T.accent:T.fg);text(['想法','试验','反馈','行动','连接','修正','积累','判断','方法'][i],xx+bw*.12,yy+bh*.64,config.portrait?17:23,T.bg,600,'sans-serif','left',p)}text('不是九张卡片，是九种关系。',x,y+h*.98,14,T.muted)}
else if(s===2){const p=prog(u,1.8,2.65),anticipate=prog(u,.2,1.6);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h*.84);ctx.clip();const offset=lerp(0,w*.4,p);rect(x+offset,y,w*.45,h*.84,T.fg);rect(x+w*.5-offset,y,w*.5,h*.84,T.accent);text('临',x+w*.2+offset,y+h*.60,big*(1-anticipate*.08),T.bg,700,'sans-serif','center');text('界',x+w*.76-offset,y+h*.60,big*(1-anticipate*.08),T.bg,700,'sans-serif','center');ctx.restore();text('当压力增加，关系必须改变。',x,y+h*.98,14,T.muted)}
else{const p=prog(u,.2,2.5);for(let i=0;i<5;i++){const k=prog(u,.3+i*.15,1.8+i*.15);rect(x,y+h*(.12+i*.14),w*lerp(.12,.9-i*.12,k),h*.065,i===0?T.accent:T.fg)}text('系统',x+w*.58,y+h*.75,config.portrait?50:90,T.fg,600,'serif','left',p);text('把复杂，重新排成有用的秩序。',x,y+h*.98,14,T.muted)}}
function branch(x,y,len,angle,depth,p,T,n){if(depth<0||p<=0)return;const xx=x+Math.cos(angle)*len*clamp(p),yy=y+Math.sin(angle)*len*clamp(p);line(x,y,xx,yy,T.fg,Math.max(1,depth*1.6));if(p>=1&&depth>0){const spread=.35+rand(n)*.27;branch(xx,yy,len*.7,angle-spread,depth-1,(p-1)*1.65,T,n*2+1);branch(xx,yy,len*.73,angle+spread,depth-1,(p-1)*1.65,T,n*2+2)}if(depth===0&&p>.1){ctx.save();ctx.translate(xx,yy);ctx.rotate(angle);ctx.fillStyle=T.accent;ctx.beginPath();ctx.ellipse(0,0,9*clamp(p),4.5*clamp(p),0,0,TAU);ctx.fill();ctx.restore()}}
function organic(T,s,u,g){const {x,y,w,h}=g,cx=x+w*.5,cy=y+h*.74;line(x,y+h*.81,x+w,y+h*.81,T.line);if(s===0){const p=prog(u,.2,3);circle(cx,cy,10,T.accent);branch(cx,cy,h*.28,-Math.PI/2,1,p*2.6,T,1);text('一粒种子，先向光靠近。',x,y+h*.98,15,T.muted);text('起点',x,y+h*.15,config.portrait?34:52,T.fg,500,'serif')}
else if(s===1){branch(cx,cy,h*.27,-Math.PI/2,4,prog(u,.1,4.7)*5.5,T,1);circle(cx,cy,7,T.accent);text('生长，是关系不断分叉。',x,y+h*.98,15,T.muted)}
else if(s===2){const a=prog(u,.2,1.7),b=prog(u,2,3.5),breathe=config.reduced?0:Math.sin(u*3)*2;for(let i=0;i<5;i++){ctx.save();ctx.translate(cx,y+h*.44);ctx.rotate(i*TAU/5+b*.6);ctx.strokeStyle=T.fg;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,w*(.25-.12*a+.1*b)+breathe,h*(.16-.11*a+.07*b),0,0,TAU);ctx.stroke();ctx.restore()}circle(cx,y+h*.44,lerp(6,15,b),T.accent);text(u<2?'蓄积':'舒展',cx,y+h*.46,config.portrait?26:36,T.fg,500,'serif','center');text('变化有代价，也有新的空间。',x,y+h*.98,15,T.muted)}
else{const p=prog(u,.2,3.7);for(let i=0;i<3;i++)branch(x+w*(.2+i*.3),cy,h*(.18+(i===1?.08:0)),-Math.PI/2,3,p*4.4,T,i+5);circle(x+w*.5,cy,7,T.accent);text('一个起点，成为一片生态。',x,y+h*.98,15,T.muted)}}
function renderFrame(t,cfg){config=cfg;t=clamp(t,0,DUR);const T=themes[config.theme],W=config.portrait?540:960,H=config.portrait?960:540;ctx.setTransform(c.width/W,0,0,c.height/H,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);rect(0,0,W,H,T.bg);const s=Math.min(3,Math.floor(t/SCENE)),u=config.reduced?4.8:t-s*SCENE,g={x:W*.08,y:H*.20,w:W*.84,h:H*.59};header(T,t,s,W,H);const visual=config.theme==='technical'?technical:config.theme==='editorial'?editorial:organic;visual(T,s,u,g,t);if(config.theme==='technical')text('DESIGNED TIMING / 120 BPM',W*.08,H*.16,10,T.muted,400,'mono');else text(config.theme==='organic'?'GROWTH / A STUDY IN RELATION':'A STUDY IN STRUCTURE',W*.08,H*.16,10,T.muted,400,'mono');return {scene:s,localTime:u};}
function render(t,cfg=config){const previous=config;try{return renderFrame(t,cfg)}finally{config=previous}}
function draw(){const begin=performance.now();const {scene}=render(time);renderCost=performance.now()-begin;$('scrub').value=time;$('clock').textContent=time.toFixed(2).padStart(5,'0')+' / 24.00';$('shotName').textContent=titles[scene];$('shotNote').textContent=notes[scene];document.querySelectorAll('[data-shot]').forEach(el=>el.classList.toggle('active',Number(el.dataset.shot)===scene));}
function tick(now){if(!playing)return;time=(now-anchor)/1000;if(time>=DUR){if($('loop').checked){time%=DUR;anchor=now-time*1000}else{time=DUR;playing=false;$('play').textContent='播放';draw();raf=0;return}}if(now-lastDraw>=1000/30){draw();lastDraw=now}raf=requestAnimationFrame(tick)}
function pause(){if(playing)time=clamp((performance.now()-anchor)/1000,0,DUR);playing=false;cancelAnimationFrame(raf);raf=0;$('play').textContent='播放';draw()}
function toggle(){if(playing){pause();return}if(time>=DUR)time=0;playing=true;anchor=performance.now()-time*1000;lastDraw=-Infinity;$('play').textContent='暂停';raf=requestAnimationFrame(tick)}
function seek(t){time=clamp(t,0,DUR);anchor=performance.now()-time*1000;draw()}
function resize(){const scale=$('quality').value==='high'?1.5:1;c.width=(config.portrait?540:960)*scale;c.height=(config.portrait?960:540)*scale;$('stage').classList.toggle('portrait',config.portrait);draw()}
$('play').onclick=toggle;$('scrub').oninput=e=>seek(Number(e.target.value));$('quality').onchange=resize;$('ratio').onclick=()=>{config.portrait=!config.portrait;$('ratio').textContent=config.portrait?'切换横屏':'切换竖屏';resize()};
document.querySelectorAll('[data-theme]').forEach(el=>el.onclick=()=>{config.theme=el.dataset.theme;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));draw()});
document.querySelectorAll('[data-shot]').forEach(el=>el.onclick=()=>seek(Number(el.dataset.shot)*SCENE));
$('title').oninput=e=>{config.title=e.target.value||'从想法，到系统';draw()};$('seed').oninput=e=>{config.seed=clamp(Number(e.target.value)||0,0,9999);draw()};$('reduced').onchange=e=>{config.reduced=e.target.checked;draw()};$('hide').onclick=()=>document.body.classList.toggle('immersive');
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowLeft'){e.preventDefault();seek(time-1)}else if(e.key==='ArrowRight'){e.preventDefault();seek(time+1)}else if(e.key==='[')seek(Math.max(0,Math.floor((time-.01)/6)*6));else if(e.key===']')seek(Math.min(18,(Math.floor(time/6)+1)*6));else if(e.key.toLowerCase()==='h')document.body.classList.toggle('immersive')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});
window.motionLab={render,seek,pause,getState:()=>({time,playing,config:{...config},renderCost})};
draw();
</script>
</html>
