<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>动态解说工作台</title><link rel="stylesheet" href="management/workbench.css"></head>
<body><aside><div class="brand">动态解说<br><small>内容与版本工作台</small></div><nav id="nav" aria-label="工作阶段"></nav><p class="side-note">一个题目一张卡。<br>先选版本，再继续制作。</p><button id="new">＋ 记一个新选题</button></aside>
<main><header><div><p class="eyebrow">MOTION DIRECTOR</p><h1 id="heading">全部内容</h1><p id="summary"></p></div><div class="toolbar"><button id="export">备份整理结果</button><label class="button" for="import">恢复备份</label><input type="file" id="import" accept="application/json,.json" hidden></div></header>
<p class="notice" id="storage" role="status">整理结果保存在当前浏览器。换浏览器或清理数据前，请先备份；不会自动写回项目文件。</p>
<div class="filters"><input type="search" id="search" placeholder="搜索题目、诗词、模型或文件名" aria-label="搜索全部内容的题目、别名、来源或版本"><select id="kind" aria-label="表现形式"><option value="all">全部形式</option><option>3D</option><option>2D</option><option>混合</option></select><span id="count" aria-live="polite"></span></div>
<div id="skillsBar" class="skills-bar" hidden></div>
<div id="grid" class="grid"></div><p id="empty" hidden>这里暂时没有项目。可以记录新选题，或切换工作阶段查看已有作品。</p>
<footer>现有作品待审状态不代表已适合发布。<a href="docs/WORKSPACE-PLAN.md" target="_blank" rel="noopener">整理方案与待审问题（文档）</a></footer></main>
<dialog id="detail"><form id="edit"><div class="dialog-top"><h2 id="title"></h2><button type="button" id="close" aria-label="关闭">关闭</button></div><p id="description"></p><div class="fields"><label>工作阶段<select id="stage"></select></label><label>选中的主版本<select id="primary"></select></label></div><h3>已有版本与导出</h3><div id="versions"></div><details><summary>登记一个新生成的版本</summary><p>登记仓库内已有文件；不会复制文件或生成视频。</p><input id="versionLabel" placeholder="版本名，如：第二版·自然配音" aria-label="新版本名称"><input id="versionPath" placeholder="相对路径，如 prism-study/prism-study.html" aria-label="新版本相对路径"><select id="versionMode" aria-label="新版本运行方式"><option value="page">网页预览</option><option value="video">MP4 视频</option><option value="server">需开发服务的源工程</option></select></details><label>你的判断 / 下一步<textarea id="notes" rows="4" maxlength="10000" placeholder="例如：保留这个镜头，配音太机械；下一步只改声音。"></textarea></label><p id="editError" role="alert"></p><div class="dialog-bottom"><span>归档只改变显示位置，可随时恢复。</span><button type="submit" class="primary">保存整理结果</button></div></form></dialog>
<dialog id="idea"><form id="create"><h2>记一个新选题</h2><label>题目<input id="ideaTitle" required maxlength="120" placeholder="我想讲清楚什么？"></label><label>观众看完要理解什么？<textarea id="ideaNote" rows="3" maxlength="10000"></textarea></label><div class="toolbar"><button type="button" id="cancelIdea">取消</button><button class="primary">保存选题</button></div></form></dialog>
<script src="management/catalog.js"></script><script src="management/file-inventory.js"></script><script src="management/workbench.js"></script></body></html>
