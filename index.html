  .brand-desc {

    color: var(--text-muted);

    margin-top: 1px;
    white-space: nowrap;

    align-items: center;

    line-height: 1;
    flex-shrink: 0;

  .panel-title {

    font-weight: 700;
    color: #fff;
    white-space: nowrap;

    font-weight: 600;
    padding: 4px 12px;

    flex-shrink: 0;

    font-size: 13px;
    color: var(--text-secondary);

    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;

    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    gap: 16px;
    align-items: center;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;

  .work-card:hover {
    background: var(--card-hover-bg);
    border-color: rgba(0, 216, 246, 0.35);
    transform: translateY(-1px);

    height: 82px;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    flex-shrink: 0;

    height: 100%;

    display: block;
    transition: transform 0.25s ease;

    background: rgba(0, 0, 0, 0.35);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 18px;
    opacity: 0;

              <div class="work-thumb-wrapper" onclick="openModal('${w.title}', '${w.path}')" title="点击立即预览 ${w.title}">
                <img src="${w.thumb}" alt="${w.title}" class="work-thumb" loading="lazy" />
                <div class="thumb-play-overlay">▶</div>
              </div>
              <div class="work-content">
                <div class="work-top-row">
                  <div class="work-name" title="${w.title}">${w.title}</div>
                  <div class="tag-group">
                    ${w.tags ? w.tags.map(t => `<span class="tag tag-${t.type}">${t.text}</span>`).join('') : ''}
                  </div>
                </div>
                <div class="work-meta">${w.meta}</div>
                <div class="work-actions">
                  <button class="btn btn-preview" onclick="openModal('${w.title}', '${w.path}')">▶ 预览</button>
                  <a href="${w.path}" target="_blank" class="btn btn-open">↗ 打开</a>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </section>
    `;
  }).join('');

  document.getElementById('cat-count').innerText = CATEGORY_REGISTRY.length;
  document.getElementById('work-count').innerText = totalWorks;
}

function openModal(title, url) {
  document.getElementById('modal-title-text').innerText = title;
  document.getElementById('modal-external-link').href = url;
  document.getElementById('preview-frame').src = url;
  document.getElementById('preview-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('preview-modal').classList.remove('active');
  document.getElementById('preview-frame').src = 'about:blank';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

renderDashboard();
</script>

</body>
</html>
